version: "3.8"
services:
  app:
    image: landcover-app:latest
    container_name: landcover-dev
    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.fileWatcherType=polling
    ports:
      - "8501:8501"
    volumes:
      - ./:/opt/app:cached
      - ./data:/opt/app/data:cached
      - ./logs:/opt/app/logs:cached
    env_file:
      - .env
    restart: unless-stopped
